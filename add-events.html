<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Community Hub (Add Event)</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
    <h1>Community Event & Task Hub</h1>
    <nav>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="events.html">Browse Events</a></li>
        <li><a href="add-event.html" class="active">Add Event</a></li>
      </ul>
    </nav>
  </header>
   <main>
    <section id="form-section">
      <h2>Create a New Community Event</h2>
      <form id="event-form" novalidate>
        <div class="form-group">
          <label for="event-title">Event Title *</label>
          <input type="text" id="event-title" name="title" placeholder="e.g. Park Cleanup Drive">
          <small class="error-msg" id="title-error"></small>
        </div>
        <div class="form-group">
          <label for="event-category">Category *</label>
          <select id="event-category" name="category">
            <option value="">Select a category</option>
            <option value="Volunteer">Volunteer</option>
            <option value="Social">Social</option>
            <option value="Sports">Sports</option>
            <option value="Education">Education</option>
          </select>
          <small class="error-msg" id="category-error"></small>
        </div>
      </section>    
   </main>
    
</body>
</html>
