<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Community Hub (Add Event)</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
    <h1>Community Event & Task Hub</h1>
    <nav>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="events.html">Browse Events</a></li>
        <li><a href="add-event.html" class="active">Add Event</a></li>
      </ul>
    </nav>
  </header>
   <main>
    <section id="form-section">
      <h2>Create a New Community Event</h2>
      <form id="event-form" novalidate>
        <div class="form-group">
          <label for="event-title">Event Title *</label>
          <input type="text" id="event-title" name="title" placeholder="e.g. Park Cleanup Drive">
          <small class="error-msg" id="title-error"></small>
        </div>
        <div class="form-group">
          <label for="event-category">Category *</label>
          <select id="event-category" name="category">
            <option value="">Select a category</option>
            <option value="Volunteer">Volunteer</option>
            <option value="Social">Social</option>
            <option value="Sports">Sports</option>
            <option value="Education">Education</option>
          </select>
          <small class="error-msg" id="category-error"></small>
        </div>
        <div class="form-group">
          <label for="event-date">Date *</label>
          <input type="date" id="event-date" name="date">
          <small class="error-msg" id="date-error"></small>
        </div>
        <div class="form-group">
          <label for="event-location">Location *</label>
          <input type="text" id="event-location" name="location" placeholder="e.g. Central Park Main Pavilion">
          <small class="error-msg" id="location-error"></small>
        </div>
        <div class="form-group">
          <label for="event-desc">Description *</label>
          <textarea id="event-desc" name="description" rows="4" placeholder="Briefly describe the event..."></textarea>
          <small class="error-msg" id="desc-error"></small>
        </div>
        <button type="submit" id="submit-btn">Add Event</button>
        </form>
      </section>    
   </main>
   <footer>
       <p>&copy; 2026 Community Event Hub</p>
</footer>
<script src="script.js"></script>
    
</body>
</html>
